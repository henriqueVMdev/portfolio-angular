<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="omni-context-title omni-context-desc">
  <title id="omni-context-title">Contexto e fronteira de segurança do OmniSeg</title>
  <desc id="omni-context-desc">O usuário acessa por HTTPS a SPA Vue servida como arquivos estáticos. A SPA obtém sessão no Auth, consulta e altera dados pelo PostgREST e envia imagens ao Storage. Auth, PostgREST, Storage e PostgreSQL ficam dentro da fronteira de segurança; o PostgreSQL aplica RLS e constraints.</desc>
  <style>
    .boundary { fill: transparent; stroke: var(--planta-line, color-mix(in srgb, currentColor 35%, transparent)); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .boundary-label { fill: var(--planta-muted, color-mix(in srgb, currentColor 55%, transparent)); font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .05em; text-transform: uppercase; }
    .node rect { fill: transparent; stroke: var(--planta-line, color-mix(in srgb, currentColor 35%, transparent)); stroke-width: 1.5; }
    .node--accent rect { fill: color-mix(in srgb, var(--planta-accent, #c07a3e) 10%, transparent); stroke: var(--planta-accent, #c07a3e); }
    .node text { fill: var(--planta-ink, currentColor); font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .node .subline { font-size: 12px; fill: var(--planta-muted, color-mix(in srgb, currentColor 55%, transparent)); }
    .edge { fill: none; stroke: var(--planta-line, color-mix(in srgb, currentColor 35%, transparent)); stroke-width: 1.5; marker-end: url(#omni-context-arrow); }
    .edge--accent { stroke: var(--planta-accent, #c07a3e); marker-end: url(#omni-context-arrow-accent); }
    .edge-label { fill: var(--planta-muted, color-mix(in srgb, currentColor 55%, transparent)); font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
  </style>
  <defs>
    <marker id="omni-context-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--planta-line, color-mix(in srgb, currentColor 35%, transparent))" />
    </marker>
    <marker id="omni-context-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--planta-accent, #c07a3e)" />
    </marker>
  </defs>

  <rect class="boundary" x="410" y="20" width="570" height="340" />
  <text class="boundary-label" x="430" y="48">Fronteira de segurança</text>

  <path class="edge edge--accent" d="M140 190 L190 190" />
  <text class="edge-label" x="165" y="176">HTTPS</text>
  <path class="edge" d="M360 158 C430 158 470 105 545 105" />
  <text class="edge-label" x="452" y="124">sessão</text>
  <path class="edge" d="M360 190 L545 195" />
  <text class="edge-label" x="452" y="180">consultas e mutações</text>
  <path class="edge" d="M360 222 C430 222 470 285 545 285" />
  <text class="edge-label" x="452" y="262">imagens</text>
  <path class="edge edge--accent" d="M695 195 L800 200" />

  <g class="node">
    <rect x="20" y="160" width="120" height="60" />
    <text x="80" y="195">Usuário</text>
  </g>
  <g class="node node--accent">
    <rect x="190" y="140" width="170" height="100" />
    <text x="275" y="184">SPA Vue</text>
    <text class="subline" x="275" y="207">arquivos estáticos</text>
  </g>
  <g class="node">
    <rect x="545" y="75" width="150" height="60" />
    <text x="620" y="110">Auth</text>
  </g>
  <g class="node node--accent">
    <rect x="545" y="165" width="150" height="60" />
    <text x="620" y="200">PostgREST</text>
  </g>
  <g class="node">
    <rect x="545" y="255" width="150" height="60" />
    <text x="620" y="290">Storage</text>
  </g>
  <g class="node node--accent">
    <rect x="800" y="155" width="160" height="90" />
    <text x="880" y="194">PostgreSQL</text>
    <text class="subline" x="880" y="218">RLS e constraints</text>
  </g>
</svg>
