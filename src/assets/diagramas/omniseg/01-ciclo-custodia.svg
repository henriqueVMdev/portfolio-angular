<svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="omni-cycle-title omni-cycle-desc">
  <title id="omni-cycle-title">Estados da custódia do OmniSeg</title>
  <desc id="omni-cycle-desc">Uma solicitação acima do limite entra em PendenteAprovacao; dentro do limite, entra em PendenteEntrega. Aprovação leva a PendenteEntrega e recusa leva a Recusado. Registrar a entrega leva a Entregue e registrar a devolução leva a Devolvido.</desc>
  <style>
    .node rect { fill: transparent; stroke: var(--planta-line, color-mix(in srgb, currentColor 35%, transparent)); stroke-width: 1.5; }
    .node--accent rect { fill: color-mix(in srgb, var(--planta-accent, #c07a3e) 10%, transparent); stroke: var(--planta-accent, #c07a3e); }
    .node text { fill: var(--planta-ink, currentColor); font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .edge { fill: none; stroke: var(--planta-line, color-mix(in srgb, currentColor 35%, transparent)); stroke-width: 1.5; marker-end: url(#omni-cycle-arrow); }
    .edge--accent { stroke: var(--planta-accent, #c07a3e); marker-end: url(#omni-cycle-arrow-accent); }
    .edge-label { fill: var(--planta-muted, color-mix(in srgb, currentColor 55%, transparent)); font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
  </style>
  <defs>
    <marker id="omni-cycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--planta-line, color-mix(in srgb, currentColor 35%, transparent))" />
    </marker>
    <marker id="omni-cycle-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--planta-accent, #c07a3e)" />
    </marker>
  </defs>

  <path class="edge" d="M150 108 C188 108 194 48 235 48" />
  <text class="edge-label" x="188" y="78">acima do limite</text>
  <path class="edge" d="M150 132 C188 132 194 192 235 192" />
  <text class="edge-label" x="188" y="170">dentro do limite</text>
  <path class="edge" d="M330 76 L330 164" />
  <text class="edge-label" x="365" y="124">aprovado</text>
  <path class="edge" d="M425 48 L515 48" />
  <text class="edge-label" x="470" y="34">recusado</text>
  <path class="edge edge--accent" d="M425 192 L570 192" />
  <text class="edge-label" x="498" y="178">entrega registrada</text>
  <path class="edge edge--accent" d="M710 192 L850 192" />
  <text class="edge-label" x="780" y="178">devolução registrada</text>

  <g class="node">
    <rect x="20" y="92" width="130" height="56" />
    <text x="85" y="125">Solicitação</text>
  </g>
  <g class="node node--accent">
    <rect x="235" y="20" width="190" height="56" />
    <text x="330" y="53">PendenteAprovacao</text>
  </g>
  <g class="node node--accent">
    <rect x="235" y="164" width="190" height="56" />
    <text x="330" y="197">PendenteEntrega</text>
  </g>
  <g class="node">
    <rect x="515" y="20" width="140" height="56" />
    <text x="585" y="53">Recusado</text>
  </g>
  <g class="node node--accent">
    <rect x="570" y="164" width="140" height="56" />
    <text x="640" y="197">Entregue</text>
  </g>
  <g class="node node--accent">
    <rect x="850" y="164" width="140" height="56" />
    <text x="920" y="197">Devolvido</text>
  </g>
</svg>
